[tools]
"cargo:sea-orm-cli" = { version = "1.1.20", features = "sqlx-postgres" }
node = "20"

[tasks.generate-entities]
alias = "ge"
run = "sea generate entity --output-dir src/entity/ --with-prelude none"
dir = "{{ config_root }}/api/adaptors/sql"

[tasks.migrate]
alias = "m"
run = "sea migrate"
dir = "{{ config_root }}/api/adaptors/sql"
