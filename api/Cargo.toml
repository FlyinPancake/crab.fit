[package]
name = "crabfit-api"
version = "3.0.0"
edition = "2024"
description = "API for Crab Fit"
license = "GPL-3.0-only"

[workspace]
members = [".", "adaptors/*", "adaptors/sql/migration", "common"]

[dependencies]
axum = { version = "0.8.9" }
base64 = "0.22.1"
bcrypt = "0.19.1"
chrono = "0.4.44"
common = { path = "common" }
datastore-adaptor = { path = "adaptors/datastore" }
dotenvy = "0.15.7"
memory-adaptor = { path = "adaptors/memory" }
punycode = "0.4.1"
rand = "0.10.1"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sql-adaptor = { path = "adaptors/sql" }
tokio = { version = "1.52.3", features = [
  "macros",
  "rt-multi-thread",
  "signal",
] }
tower = "0.5.3"
tower_governor = "0.8.0"
tower-http = { version = "0.6.10", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa = { version = "5.5.0", features = ["axum_extras", "preserve_order"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "debug-embed"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
utoipa-axum = "0.2.0"
ambassador = "0.5"


[features]
datastore-adaptor = []
sql-adaptor = []
