[package]
name = "crabfit-api"
version = "3.0.0"
edition = "2021"
description = "API for Crab Fit"
license = "GPL-3.0-only"

[workspace]
members = [".","adaptors/*", "adaptors/sql/migration", "common"]

[dependencies]
axum = { version = "0.6.18", features = ["headers"] }
base64 = "0.21.0"
bcrypt = "0.16.0"
chrono = "0.4.24"
common = { path = "common" }
datastore-adaptor = { path = "adaptors/datastore" }
dotenvy = "0.15.7"
memory-adaptor = { path = "adaptors/memory" }
punycode = "0.4.1"
rand = "0.8.5"
regex = "1.8.1"
serde = { version = "1.0.162", features = ["derive"] }
serde_json = "1.0.96"
sql-adaptor = { path = "adaptors/sql" }
tokio = { version = "1.28.0", features = ["macros", "rt-multi-thread"] }
tower = "0.4.13"
tower_governor = "0.0.4"
tower-http = { version = "0.4.0", features = ["cors", "trace"] }
tracing = "0.1.37"
tracing-subscriber = "0.3.17"
utoipa = { version = "3.3.0", features = ["axum_extras", "preserve_order"] }
utoipa-swagger-ui = { version = "3.1.3", features = ["axum", "debug-embed"] }

[features]
datastore-adaptor = []
sql-adaptor = []
